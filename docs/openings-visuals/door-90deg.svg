<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1300 -1400 6600 2800" style="background-color: #f8fafc; font-family: monospace;">
  <defs>
    <pattern id="clearance-hatch" width="20" height="20" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="20" stroke="#f43f5e" stroke-width="3" opacity="0.4" />
    </pattern>
  </defs>
  <text x="-1270" y="-1350" font-size="28" font-weight="bold" fill="#0f172a">Porte battante 90° (découpe 2.5D : full + void + linteau)</text>
  <g id="wall-pieces">
    <!-- Piece w_door_piece_0 (full) -->
    <polygon points="1550,100 1550,-100 0,-100 0,100" fill="rgba(59, 130, 246, 0.45)" stroke="#1d4ed8" stroke-width="3"  />
    <!-- Piece w_door_piece_1 (void) -->
    <polygon points="2450,100 2450,-100 1550,-100 1550,100" fill="rgba(254, 242, 242, 0.7)" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,4" />
    <!-- Piece w_door_piece_3 (full) -->
    <polygon points="2450,100 4000,100 4000,-100 2450,-100" fill="rgba(59, 130, 246, 0.45)" stroke="#1d4ed8" stroke-width="3"  />
  </g>
  <g id="clearance-zones">
    <polygon points="0,-110 50,-110 50,110 0,110" fill="url(#clearance-hatch)" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" />
    <polygon points="3950,-110 4000,-110 4000,110 3950,110" fill="url(#clearance-hatch)" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" />
  </g>
  <line x1="0" y1="0" x2="4000" y2="0" stroke="#64748b" stroke-width="2" stroke-dasharray="8,6" />
  <g id="openings-symbols">
    <!-- Porte door_entry -->
    <line x1="1550" y1="0" x2="1550" y2="-900" stroke="#0f172a" stroke-width="5" />
    <path d="M 2450 0 A 900 900 0 0 1 1550 -900" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="6,4" />
    <text x="2000" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#0f172a">door_entry (P. 900×2100)</text>
  </g>
</svg>